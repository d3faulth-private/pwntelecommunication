! LAB-ONLY: must never be deployed to a production network.
! Review-only signalling fragment; see docs/architecture.md before use.
! User manual: https://downloads.osmocom.org/docs/osmo-bsc/1.14.1/osmobsc-usermanual.pdf
! VTY syntax: https://downloads.osmocom.org/docs/osmo-bsc/1.14.1/osmobsc-vty-reference.pdf
! Intentionally identical in both profiles: admission policy lives at the STP.
! TODO: sponsor-approved PLMN, BTS/Abis and MGW settings in an untracked copy.
! No RF or subscriber configuration is provided here.
line vty
 bind 127.0.0.4
cs7 instance 0
 point-code 1.1.1
 asp lab-bsc 2905 2905 m3ua
  local-ip 127.0.0.4
  remote-ip 127.0.0.2
  role asp
  transport-role client
  no shutdown
 as lab-bsc m3ua
  asp lab-bsc
  routing-key 1 1.1.1
 sccp-address lab-msc
  routing-indicator PC
  point-code 3.3.3
msc 0
 msc-addr lab-msc
