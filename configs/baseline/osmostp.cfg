! LAB-ONLY: must never be deployed to a production network.
! Review-only signalling fragment; see docs/architecture.md before use.
! User manual: https://downloads.osmocom.org/docs/osmo-stp/2.2.0/osmostp-usermanual.pdf
! VTY syntax: https://downloads.osmocom.org/docs/osmo-stp/2.2.0/osmostp-vty-reference.pdf
! Deliberately permissive ASP admission and dynamic routing-key allocation.
! Only inside a dedicated, disconnected lab network namespace.
line vty
 bind 127.0.0.2
cs7 instance 0
 point-code 0.0.0
 xua rkm routing-key-allocation dynamic-permitted
 asp lab-bsc 2905 2905 m3ua
  local-ip 127.0.0.2
  remote-ip 127.0.0.4
  role sg
  transport-role server
  no shutdown
 as lab-bsc m3ua
  asp lab-bsc
  routing-key 1 1.1.1
 asp lab-msc 2905 2905 m3ua
  local-ip 127.0.0.2
  remote-ip 127.0.0.3
  role sg
  transport-role server
  no shutdown
 as lab-msc m3ua
  asp lab-msc
  routing-key 3 3.3.3
 route-table system
  update route 1.1.1 7.255.7 linkset lab-bsc
  update route 3.3.3 7.255.7 linkset lab-msc
 listen m3ua 2905
  local-ip 127.0.0.2
  accept-asp-connections dynamic-permitted
